<!DOCTYPE html>
<html>
    <head>
        <title>Advance search</title>
    </head>
    <style>
        body{
         
            margin-top: 150px;

        }
        h1{
            position: absolute;
            top: 80px;
            left: 30px;

        }
        h2{
            position:absolute;
            top: 10px;
            left: 10px;
            
        }
        nav a{
            text-decoration: none;
        }
        nav{
            position: absolute;
            top: 10px;
            right: 20px;
        }
        form{
            max-width: 600px;
        }
     label{
    display: inline-block;
    width: 200px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 5px;
    text-align: right;
     }
     input[type="text"] {
    width: 350px;
    margin-bottom: 10px;
    padding: 8px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid grey;
   }
   .butn
   {
    margin-top: 30px;
    color: white;
    background-color: lightskyblue;
    border-radius: 5px;
    border: none;
    cursor: pointer;

   }
       
    </style>

    <body>
        <nav>
            <a href="index.html">Back to Search</a>
        </nav>

        <h2>
            <span style="color: blue;">G</span><span style="color: red;">o</span><span style="color: yellow;">o</span><span style="color: blue;">g</span><span style="color: green;">l</span><span style="color: red;">e</span>
        </h2>

        <h1 style="color: red; font-size: 100%;">Advanced Search</h1>
        <hr>
        
        <p>Find pages with...</p>

        <form action="https://www.google.com/search">

            <label>
                all these words:
            </label>
            <input type="text" name="as_q">

            <label>This exact word pharse:
            </label>
            <input type="text" name="as_epq">
            
            <label>Any of these words:
            </label>
            <input type="text" name="as_oq">

            <label>None of these words:
            </label>
            <input type="text" name="as_eq">

           <input type="submit" value="Advanced Search" class="butn">

        </form>
    </body>
</html>
